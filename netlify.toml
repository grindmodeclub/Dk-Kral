# Hosting: Netlify (napojené na GitHub grindmodeclub/Dk-Kral, vetva main).
# Každá verejná stránka je prerenderovaný HTML súbor (scripts/prerender.mjs), žiadny SPA fallback:
# neexistujúce URL vracajú skutočný 404 (dist/404.html).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Duplicitné adresy .html → čistá URL (rovnaký obsah nesmie byť na dvoch adresách)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sluzby.html"
  to = "/sluzby"
  status = 301
  force = true

[[redirects]]
  from = "/cenik.html"
  to = "/cenik"
  status = 301
  force = true

[[redirects]]
  from = "/prubeh.html"
  to = "/prubeh"
  status = 301
  force = true

[[redirects]]
  from = "/kontakt.html"
  to = "/kontakt"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301
  force = true


# Administrácia je SPA bez prerenderu
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Staré názvy obrázkov (mohli sa dostať do indexu obrázkov / zdieľaní)
[[redirects]]
  from = "/hero-reception.jpg"
  to = "/img/og-dk-kral-zubar-hradec-kralove.jpg"
  status = 301

[[redirects]]
  from = "/logo_dk_kral_gold.png"
  to = "/img/logo-dk-kral.png"
  status = 301

[[redirects]]
  from = "/korunka_gold.png"
  to = "/favicon-48.png"
  status = 301

# --- hlavičky ---

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JS a CSS z Vite majú hash v názve → môžu sa cachovať navždy
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/cookie-consent/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon-48.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
